[project]
name = "kiro-computer-vision"
version = "0.1.0"
description = "Workshop repository: build your own computer vision app with Kiro"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core computer vision stack.
    # Pins chosen for known mutual compatibility; bump deliberately and re-test.
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    # mediapipe depends on opencv-contrib-python without a pin, so pip also
    # installs a contrib build. Pin it too so the version actually imported is
    # deliberate rather than whatever is newest on PyPI.
    "opencv-contrib-python==4.10.0.84",
    "mediapipe==0.10.14",
    # Object detection for demos/scavenger_hunt. Ultralytics ships COCO-pretrained
    # weights and downloads them on first use.
    # torch must come from the CPU index first (see tool.uv.sources below),
    # otherwise PyPI drags in 3-5 GB of CUDA wheels for no benefit on a laptop demo.
    "ultralytics==8.4.111",
    "torch==2.13.0",
    "torchvision==0.28.0",
    # Text-prompted segmentation for demos/sam_labeler (SAM 3.1).
    "transformers==5.14.1",
    "huggingface-hub==1.25.1",
    "Pillow==12.3.0",
    # Web layer for demos/ (Flask apps under demos/*/web.py).
    "flask==3.1.3",
    "flask-sock==0.7.0",
    "simple-websocket==1.1.0",
    # Testing.
    "pytest==9.1.1",
]

[tool.uv.sources]
# Install the CPU-only torch build from PyTorch's own index.
# This keeps the install at ~250 MB instead of 3-5 GB for the CUDA build.
# Remove this section if you need GPU acceleration and have a CUDA setup.
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# Keep requirements.txt around as a human-readable reference and for tools
# that don't support pyproject.toml yet. uv.lock is the authoritative lockfile.

[tool.hatch.build.targets.wheel]
packages = ["demos", "projects"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
